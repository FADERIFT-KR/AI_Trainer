[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trainer"
version = "0.1.0"
description = "Camera-based 2-D pose and estimated 3-D skeleton visualizer"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mediapipe>=0.10",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.8",
  "PyQt5>=5.15",
]

[project.scripts]
ai-trainer-live = "ai_trainer.live_pose.cli:main"
ai-trainer-reference = "ai_trainer.reference.cli:main"
ai-trainer = "ai_trainer.reference.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
